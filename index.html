<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adventure Realm</title>
<style>
body{margin:0;background:#183b28;color:white;font-family:sans-serif;text-align:center}
h1{margin:15px}
#game{height:70vh;position:relative;overflow:hidden;background:#4b9b55}
#player{position:absolute;font-size:45px;left:50%;top:50%}
.coin{position:absolute;font-size:30px}
#info{font-size:18px;margin:10px}
button{font-size:24px;padding:15px;margin:5px;border-radius:15px}
</style>
</head>
<body>

<h1>🏰 Adventure Realm</h1>
<div id="info">🪙 เหรียญ: <span id="score">0</span></div>

<div id="game">
<div id="player">🧙</div>
<div class="coin" style="left:20%;top:30%">🪙</div>
<div class="coin" style="left:70%;top:25%">🪙</div>
<div class="coin" style="left:40%;top:65%">🪙</div>
<div class="coin" style="left:80%;top:70%">🪙</div>
</div>

<div>
<button onclick="move(0,-30)">⬆️</button><br>
<button onclick="move(-30,0)">⬅️</button>
<button onclick="move(0,30)">⬇️</button>
<button onclick="move(30,0)">➡️</button>
</div>

<script>
let x=50,y=50,score=0;
function move(dx,dy){
x+=dx/10;y+=dy/10;
x=Math.max(5,Math.min(95,x));
y=Math.max(5,Math.min(90,y));
player.style.left=x+'%';
player.style.top=y+'%';
document.querySelectorAll('.coin').forEach(c=>{
let a=parseFloat(c.style.left),b=parseFloat(c.style.top);
if(Math.abs(x-a)<8&&Math.abs(y-b)<8){
c.style.display='none';
score++;
document.getElementById('score').textContent=score;
}
});
}
</script>

</body>
  </html>
